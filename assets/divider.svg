<svg fill="none" viewBox="0 0 850 24" width="100%" height="24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base Divider Gradient -->
    <linearGradient id="div-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0"/>
      <stop offset="30%" stop-color="#A78BFA" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#DDD6FE" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#A78BFA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>

    <!-- Animated Scanning Laser Beam -->
    <linearGradient id="laser-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="45%" stop-color="#C4B5FD" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="55%" stop-color="#C4B5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <filter id="laser-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes sweep-line {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(950px); }
    }
    .laser-scan {
      animation: sweep-line 3.2s ease-in-out infinite;
    }
  </style>

  <!-- Base Subtle Line -->
  <line x1="0" y1="12" x2="850" y2="12" stroke="url(#div-base)" stroke-width="1.2"/>

  <!-- Animated Glowing Scanning Laser -->
  <g class="laser-scan" filter="url(#laser-glow)">
    <rect x="0" y="11" width="220" height="2" fill="url(#laser-beam)" rx="1"/>
    <circle cx="110" cy="12" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Center Star -->
  <circle cx="425" cy="12" r="3" fill="#E9D5FF"/>
  <path d="M 425 5 Q 426 10, 431 12 Q 426 14, 425 19 Q 424 14, 419 12 Q 424 10, 425 5 Z" fill="#DDD6FE"/>
</svg>
