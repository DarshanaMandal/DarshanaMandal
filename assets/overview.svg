<svg fill="none" viewBox="0 0 850 250" width="100%" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180E2C"/>
      <stop offset="50%" stop-color="#21133B"/>
      <stop offset="100%" stop-color="#140A24"/>
    </linearGradient>

    <!-- Tag Pill Gradient -->
    <linearGradient id="tag-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Scanning Line Gradient -->
    <linearGradient id="scan-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="bg-grid-lines" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#C4B5FD" stroke-opacity="0.04" stroke-width="0.8"/>
    </pattern>

    <filter id="scan-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .card-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      fill: #FFFFFF;
    }
    .card-tag {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9.5px;
      font-weight: 700;
      fill: #DDD6FE;
      letter-spacing: 0.5px;
    }
    .card-body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 400;
      fill: #E9D5FF;
      line-height: 1.4;
    }
    .card-icon {
      font-size: 22px;
    }
    
    @keyframes scan-vertical {
      0% { transform: translateY(-30px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(260px); opacity: 0; }
    }
    .scanner-line {
      animation: scan-vertical 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="850" height="250" rx="14" fill="#120722" stroke="#C4B5FD" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Background Grid Lines -->
  <rect width="850" height="250" rx="14" fill="url(#bg-grid-lines)"/>

  <!-- Animated Scanning Cyber Line -->
  <g class="scanner-line" filter="url(#scan-glow)">
    <line x1="10" y1="0" x2="840" y2="0" stroke="url(#scan-line-grad)" stroke-width="1.5"/>
  </g>

  <!-- ================= CARD 1: ECE Undergrad (Top-Left) ================= -->
  <g transform="translate(20, 18)">
    <rect width="395" height="102" rx="10" fill="url(#card-grad)" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <!-- Icon Circle -->
    <circle cx="32" cy="34" r="18" fill="#2D194C"/>
    <text x="32" y="41" text-anchor="middle" class="card-icon">🎓</text>
    <!-- Title & Tag -->
    <text x="60" y="30" class="card-title">ECE Undergrad @ VIT</text>
    <rect x="60" y="36" width="160" height="16" rx="8" fill="url(#tag-grad)" stroke="#C4B5FD" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="140" y="48" text-anchor="middle" class="card-tag">HARDWARE + CS SYNERGY</text>
    <!-- Body -->
    <text x="20" y="74" class="card-body">Bridging the sweet spot between low-level embedded hardware</text>
    <text x="20" y="90" class="card-body">systems and high-level distributed neural intelligence.</text>
  </g>

  <!-- ================= CARD 2: AI & Systems (Top-Right) ================= -->
  <g transform="translate(435, 18)">
    <rect width="395" height="102" rx="10" fill="url(#card-grad)" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <!-- Icon Circle -->
    <circle cx="32" cy="34" r="18" fill="#2D194C"/>
    <text x="32" y="41" text-anchor="middle" class="card-icon">🧠</text>
    <!-- Title & Tag -->
    <text x="60" y="30" class="card-title">AI &amp; Systems Engineer</text>
    <rect x="60" y="36" width="170" height="16" rx="8" fill="url(#tag-grad)" stroke="#C4B5FD" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="145" y="48" text-anchor="middle" class="card-tag">AGENTIC SWARMS · RAG</text>
    <!-- Body -->
    <text x="20" y="74" class="card-body">Architecting clinical multi-agent reasoning loops, semantic</text>
    <text x="20" y="90" class="card-body">search with FAISS &amp; RAG, and high-concurrency backend services.</text>
  </g>

  <!-- ================= CARD 3: Embedded Tinkerer (Bottom-Left) ================= -->
  <g transform="translate(20, 130)">
    <rect width="395" height="102" rx="10" fill="url(#card-grad)" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <!-- Icon Circle -->
    <circle cx="32" cy="34" r="18" fill="#2D194C"/>
    <text x="32" y="41" text-anchor="middle" class="card-icon">⚙️</text>
    <!-- Title & Tag -->
    <text x="60" y="30" class="card-title">Embedded &amp; Firmware Tinkerer</text>
    <rect x="60" y="36" width="160" height="16" rx="8" fill="url(#tag-grad)" stroke="#C4B5FD" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="140" y="48" text-anchor="middle" class="card-tag">TM4C123GXL · ESP32 · VLSI</text>
    <!-- Body -->
    <text x="20" y="74" class="card-body">Hands-on pan-tilt laser target-tracking rigs, sensor fusion</text>
    <text x="20" y="90" class="card-body">arrays on ESP32, and CMOS circuit design in Cadence Virtuoso.</text>
  </g>

  <!-- ================= CARD 4: Industrial Experience (Bottom-Right) ================= -->
  <g transform="translate(435, 130)">
    <rect width="395" height="102" rx="10" fill="url(#card-grad)" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <!-- Icon Circle -->
    <circle cx="32" cy="34" r="18" fill="#2D194C"/>
    <text x="32" y="41" text-anchor="middle" class="card-icon">🛢️</text>
    <!-- Title & Tag -->
    <text x="60" y="30" class="card-title">Industrial Experience</text>
    <rect x="60" y="36" width="170" height="16" rx="8" fill="url(#tag-grad)" stroke="#C4B5FD" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="145" y="48" text-anchor="middle" class="card-tag">IOCL DIGBOI REFINERY</text>
    <!-- Body -->
    <text x="20" y="74" class="card-body">Interned at IOCL Digboi Refinery, analyzing industrial sensor loops,</text>
    <text x="20" y="90" class="card-body">field calibration, and automated PLC/SCADA safety architectures.</text>
  </g>
</svg>
