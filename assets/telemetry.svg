<svg fill="none" viewBox="0 0 850 215" width="100%" height="215" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140B24"/>
      <stop offset="50%" stop-color="#1F1138"/>
      <stop offset="100%" stop-color="#281546"/>
    </linearGradient>

    <linearGradient id="circle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="50%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="telemetry-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .stat-number {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 34px;
      font-weight: 800;
      fill: #FFFFFF;
    }
    .stat-label {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #C4B5FD;
    }
    .stat-sub {
      font-family: 'Fira Code', monospace;
      font-size: 10.5px;
      fill: #A78BFA;
    }
    .grade-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 36px;
      font-weight: 900;
      fill: #DDD6FE;
    }
    .lang-name {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #E9D5FF;
    }
  </style>

  <!-- Container Box -->
  <rect width="850" height="215" rx="14" fill="url(#card-bg)" stroke="#C4B5FD" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Card 1: Total Activity -->
  <g transform="translate(25, 20)">
    <rect width="235" height="175" rx="10" fill="#180E2C" stroke="#A78BFA" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="34" class="stat-label">🚀 TOTAL COMMITS</text>
    <text x="20" y="85" class="stat-number">84</text>
    <text x="20" y="112" class="stat-sub">✦ 2024 - 2025 Activity</text>
    <!-- Mini progress bar -->
    <rect x="20" y="136" width="195" height="7" rx="3.5" fill="#2A174A"/>
    <rect x="20" y="136" width="170" height="7" rx="3.5" fill="#C4B5FD"/>
  </g>

  <!-- Card 2: Code Health & Grade -->
  <g transform="translate(280, 20)">
    <rect width="245" height="175" rx="10" fill="#180E2C" stroke="#A78BFA" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="34" class="stat-label">⚡ CODE INTEGRITY</text>
    <!-- Circle gauge -->
    <circle cx="68" cy="104" r="38" stroke="#2A174A" stroke-width="6" fill="none"/>
    <circle cx="68" cy="104" r="38" stroke="url(#circle-grad)" stroke-width="6" stroke-dasharray="240" stroke-dashoffset="38" stroke-linecap="round" fill="none"/>
    <text x="68" y="114" text-anchor="middle" class="grade-text">A+</text>
    <text x="130" y="88" class="stat-sub">✦ Reliability</text>
    <text x="130" y="110" class="stat-label" font-size="14px">99.4%</text>
    <text x="130" y="132" class="stat-sub">Top 10% Tier</text>
  </g>

  <!-- Card 3: Top Stack Distribution (Java -> Embedded C -> Python -> TS & Web) -->
  <g transform="translate(545, 20)">
    <rect width="280" height="175" rx="10" fill="#180E2C" stroke="#A78BFA" stroke-opacity="0.25" stroke-width="1"/>
    <text x="18" y="28" class="stat-label">🔮 TOP TECH STACK</text>
    
    <!-- 1. Java -->
    <text x="18" y="52" class="lang-name">Java</text>
    <text x="262" y="52" class="stat-sub" text-anchor="end">36%</text>
    <rect x="18" y="57" width="244" height="4.5" rx="2.25" fill="#2A174A"/>
    <rect x="18" y="57" width="88" height="4.5" rx="2.25" fill="#DDD6FE"/>

    <!-- 2. Embedded C -->
    <text x="18" y="82" class="lang-name">Embedded C / C++</text>
    <text x="262" y="82" class="stat-sub" text-anchor="end">28%</text>
    <rect x="18" y="87" width="244" height="4.5" rx="2.25" fill="#2A174A"/>
    <rect x="18" y="87" width="68" height="4.5" rx="2.25" fill="#C4B5FD"/>

    <!-- 3. Python -->
    <text x="18" y="112" class="lang-name">Python</text>
    <text x="262" y="112" class="stat-sub" text-anchor="end">22%</text>
    <rect x="18" y="117" width="244" height="4.5" rx="2.25" fill="#2A174A"/>
    <rect x="18" y="117" width="54" height="4.5" rx="2.25" fill="#A78BFA"/>

    <!-- 4. TypeScript & Web -->
    <text x="18" y="142" class="lang-name">TypeScript &amp; Web</text>
    <text x="262" y="142" class="stat-sub" text-anchor="end">14%</text>
    <rect x="18" y="147" width="244" height="4.5" rx="2.25" fill="#2A174A"/>
    <rect x="18" y="147" width="34" height="4.5" rx="2.25" fill="#8B5CF6"/>
  </g>
</svg>
