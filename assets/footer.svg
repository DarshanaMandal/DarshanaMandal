      <stop offset="0%" stop-color="#140A26"/>
      <stop offset="50%" stop-color="#281446"/>
      <stop offset="100%" stop-color="#120822"/>
    </linearGradient>

    <linearGradient id="footer-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0.3"/>
