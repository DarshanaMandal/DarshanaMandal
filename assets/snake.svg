<svg fill="none" viewBox="0 0 850 190" width="100%" height="190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="snake-bg-vibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Snake Head & Body Gradient -->
    <linearGradient id="snake-skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-vibrant" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .header-tag {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #38BDF8;
      font-weight: 700;
    }
    .header-sub {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      fill: #94A3B8;
    }
    .legend-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11px;
      fill: #94A3B8;
      font-weight: 500;
    }
    
    @keyframes crawl-path {
      0% { transform: translate(0px, 0px); }
      18% { transform: translate(126px, 0px); }
      32% { transform: translate(126px, 36px); }
      50% { transform: translate(288px, 36px); }
      68% { transform: translate(288px, 72px); }
      82% { transform: translate(468px, 72px); }
      100% { transform: translate(684px, 0px); }
    }
    @keyframes food-bounce {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 6px #F43F5E); }
    }
    .animated-snake {
      animation: crawl-path 9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .food-apple {
      animation: food-bounce 1.8s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

