<svg fill="none" viewBox="0 0 850 170" width="100%" height="170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snake-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140B24"/>
      <stop offset="100%" stop-color="#23133D"/>
    </linearGradient>

    <linearGradient id="dot-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <filter id="glow-snake" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .grid-label {
      font-family: 'Fira Code', 'Segoe UI', monospace;
      font-size: 11px;
      fill: #A78BFA;
      font-weight: 600;
    }
    .status-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11.5px;
      fill: #DDD6FE;
    }
    @keyframes crawl {
      0% { transform: translate(0px, 0px); }
      25% { transform: translate(140px, 0px); }
      50% { transform: translate(140px, 32px); }
      75% { transform: translate(320px, 32px); }
      100% { transform: translate(560px, 0px); }
    }
    @keyframes pulse-food {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    .snake-body {
      animation: crawl 8s linear infinite;
    }
    .food {
      animation: pulse-food 2s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

