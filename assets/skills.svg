<svg fill="none" viewBox="0 0 850 250" width="100%" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skills-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140B24"/>
      <stop offset="50%" stop-color="#1F1138"/>
      <stop offset="100%" stop-color="#281546"/>
    </linearGradient>

    <linearGradient id="bar-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="60%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
    <linearGradient id="bar-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="60%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <style>
    .skill-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #FFFFFF;
    }
    .skill-pct {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      font-weight: 700;
      fill: #DDD6FE;
    }
    .tier-badge {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      fill: #23133D;
    }
  </style>

  <!-- Container Box -->
  <rect width="850" height="250" rx="14" fill="url(#skills-bg)" stroke="#C4B5FD" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Row 1: Applied AI & Agentic RAG -->
  <g transform="translate(35, 26)">
    <text x="0" y="14" class="skill-title">🧠 Applied AI &amp; Agentic RAG</text>
    <text x="640" y="14" class="skill-pct">90%</text>
    <!-- Badge -->
    <rect x="685" y="0" width="95" height="20" rx="10" fill="#DDD6FE"/>
    <text x="732" y="14" text-anchor="middle" class="tier-badge">ADVANCED</text>
    <!-- Bar -->
    <rect x="0" y="24" width="780" height="8" rx="4" fill="#140822"/>
    <rect x="0" y="24" width="702" height="8" rx="4" fill="url(#bar-grad-1)"/>
  </g>

  <!-- Row 2: High-Throughput Backend -->
  <g transform="translate(35, 70)">
    <text x="0" y="14" class="skill-title">⚡ High-Throughput Backend &amp; APIs</text>
    <text x="640" y="14" class="skill-pct">85%</text>
    <!-- Badge -->
    <rect x="685" y="0" width="95" height="20" rx="10" fill="#DDD6FE"/>
    <text x="732" y="14" text-anchor="middle" class="tier-badge">ADVANCED</text>
    <!-- Bar -->
    <rect x="0" y="24" width="780" height="8" rx="4" fill="#140822"/>
    <rect x="0" y="24" width="663" height="8" rx="4" fill="url(#bar-grad-1)"/>
  </g>

  <!-- Row 3: Embedded Systems & IoT -->
  <g transform="translate(35, 114)">
    <text x="0" y="14" class="skill-title">🎯 Embedded Systems &amp; IoT Hardware</text>
    <text x="640" y="14" class="skill-pct">80%</text>
    <!-- Badge -->
    <rect x="685" y="0" width="95" height="20" rx="10" fill="#C4B5FD"/>
    <text x="732" y="14" text-anchor="middle" class="tier-badge">PROFICIENT</text>
    <!-- Bar -->
    <rect x="0" y="24" width="780" height="8" rx="4" fill="#140822"/>
    <rect x="0" y="24" width="624" height="8" rx="4" fill="url(#bar-grad-2)"/>
  </g>

  <!-- Row 4: System Design & Architecture -->
  <g transform="translate(35, 158)">
    <text x="0" y="14" class="skill-title">🏗️ System Design &amp; Clean Architecture</text>
    <text x="640" y="14" class="skill-pct">72%</text>
    <!-- Badge -->
    <rect x="685" y="0" width="95" height="20" rx="10" fill="#C4B5FD"/>
    <text x="732" y="14" text-anchor="middle" class="tier-badge">PROFICIENT</text>
    <!-- Bar -->
    <rect x="0" y="24" width="780" height="8" rx="4" fill="#140822"/>
    <rect x="0" y="24" width="561" height="8" rx="4" fill="url(#bar-grad-2)"/>
  </g>

  <!-- Row 5: VLSI & Digital Logic -->
  <g transform="translate(35, 202)">
    <text x="0" y="14" class="skill-title">🔬 VLSI Design &amp; Digital Logic</text>
    <text x="640" y="14" class="skill-pct">65%</text>
    <!-- Badge -->
    <rect x="685" y="0" width="95" height="20" rx="10" fill="#A78BFA"/>
    <text x="732" y="14" text-anchor="middle" class="tier-badge" fill="#FFFFFF">ACTIVE</text>
    <!-- Bar -->
    <rect x="0" y="24" width="780" height="8" rx="4" fill="#140822"/>
    <rect x="0" y="24" width="507" height="8" rx="4" fill="url(#bar-grad-2)"/>
  </g>
</svg>
